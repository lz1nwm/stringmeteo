name: Weather update

on:
  schedule:
    - cron: "0 10,22 * * *"
  workflow_dispatch:

concurrency:
  group: weather-update
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  render:
    name: Update data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve data
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 4
          max_attempts: 3
          retry_wait_seconds: 20
          command: >
            docker run --rm
            --user "$(id -u):$(id -g)"
            -v "$PWD:/work"
            -w /work
            ${{ steps.image.outputs.name }}
            Rscript get_stringmeteo.R

      - name: Daily chart
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 4
          max_attempts: 2
          retry_wait_seconds: 20
          command: >
            docker run --rm
            --user "$(id -u):$(id -g)"
            -v "$PWD:/work"
            -w /work
            ${{ steps.image.outputs.name }}
            Rscript daily_chart.R

      - name: Commit new data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update weather data