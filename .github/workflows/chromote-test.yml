name: Test Chromote

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test StringMeteo with Chromote
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull "${{ steps.image.outputs.name }}"

      - name: Verify Chrome and Chromote
        run: |
          docker run --rm \
            "${{ steps.image.outputs.name }}" \
            bash -lc '
              set -e

              echo "Chrome executable:"
              Rscript -e "cat(chromote::find_chrome(), \"\n\")"

              echo "Chrome version:"
              "$(Rscript -e "cat(chromote::find_chrome())")" --version

              echo "Chromote version:"
              Rscript -e "cat(as.character(packageVersion(\"chromote\")), \"\n\")"
            '

      - name: Run Chromote test
        run: |
          mkdir -p chromote-debug

          docker run --rm \
            --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/chrome-home \
            -e XDG_CONFIG_HOME=/tmp/chrome-home/.config \
            -e XDG_CACHE_HOME=/tmp/chrome-home/.cache \
            -e XDG_DATA_HOME=/tmp/chrome-home/.local/share \
            -e CHROME_USER_DATA_DIR=/tmp/chrome-home/profile \
            -e STRINGMETEO_STATION=15614 \
            -e STRINGMETEO_YEAR=2026 \
            -e STRINGMETEO_MONTH=7 \
            -e STRINGMETEO_DAY=1 \
            -e STRINGMETEO_TIMEOUT=90 \
            -e STRINGMETEO_OUTPUT_DIR=chromote-debug \
            -v "$PWD:/work" \
            -w /work \
            "${{ steps.image.outputs.name }}" \
            sh -ec '
              mkdir -p \
                "$HOME" \
                "$XDG_CONFIG_HOME" \
                "$XDG_CACHE_HOME" \
                "$XDG_DATA_HOME/applications" \
                "$CHROME_USER_DATA_DIR"

              echo "Container UID: $(id -u)"
              echo "HOME: $HOME"
              echo "Chrome profile: $CHROME_USER_DATA_DIR"

              exec Rscript test_chromote.R
            '

      - name: Upload Chromote diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromote-diagnostics
          path: chromote-debug/
          if-no-files-found: warn
          retention-days: 7