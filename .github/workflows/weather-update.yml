name: Weather update

on:
  schedule:
    - cron: "0 10,22 * * *"
      timezone: "Europe/Sofia"
  workflow_dispatch:

concurrency:
  group: weather-update
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  render:
    name: Update data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve data and render chart
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:/work" \
              -w /work \
              ${{ steps.image.outputs.name }} \
              bash -lc 'Rscript get_stringmeteo.R && Rscript daily_chart.R'

      - name: Commit new data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update weather data